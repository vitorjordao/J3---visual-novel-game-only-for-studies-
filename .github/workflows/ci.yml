name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: Testes Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Instalar dependencias de teste
        run: pip install -r requirements-test.txt

      - name: Rodar pytest
        run: pytest -v

  renpy-lint:
    name: Ren'Py lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache do Ren'Py SDK
        id: cache-renpy
        uses: actions/cache@v4
        with:
          path: renpy-sdk
          key: renpy-sdk-8.2.3

      - name: Baixar Ren'Py SDK 8.2.3
        if: steps.cache-renpy.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p renpy-sdk
          cd renpy-sdk
          curl -fsSL -o sdk.tar.bz2 https://www.renpy.org/dl/8.2.3/renpy-8.2.3-sdk.tar.bz2
          tar -xjf sdk.tar.bz2 --strip-components=1
          rm sdk.tar.bz2

      - name: Rodar lint
        run: |
          # Ren'Py espera um diretorio de projeto contendo subpasta `game/`.
          ./renpy-sdk/renpy.sh "Projeto/J3 Project" lint
